    button, input { font: inherit; }

    h1 { margin: 0; font-size: 22px; line-height: 1.25; letter-spacing: -.02em; }
    .intro { margin: 6px 0 14px; color: var(--secondary); font-size: 14px; }

    .filters { display: flex; flex-wrap: wrap; gap: 8px; }
    .filter { min-height: 34px; padding: 6px 13px; border: 1px solid var(--line); border-radius: 999px; color: var(--secondary); background: var(--surface); cursor: pointer; }

    .uid-search { display: flex; gap: 6px; margin-left: auto; }
    .uid-search button { min-height: 36px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--secondary); cursor: pointer; white-space: nowrap; }
    .uid-search #searchButton { border-color: var(--blue); background: var(--blue); color: #fff; font-weight: 650; }

    .legend-mark::after { content: "✓"; position: absolute; inset: 0; display: grid; place-items: center; color: var(--blue); font-size: 13px; font-weight: 800; }
    .users { display: grid; gap: 18px; }

    .user-title { display: flex; align-items: baseline; flex-wrap: wrap; gap: 9px; }
    .group-badge { display: inline-block; padding: 3px 8px; border-radius: 5px; color: #fff; background: var(--blue); font-size: 12px; font-weight: 700; }
    .user-name { font-size: 19px; font-weight: 760; }
    .user-name.empty { color: var(--secondary); }
    .uid { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; word-break: break-all; }
    .identity { display: grid; grid-template-columns: repeat(3, minmax(140px, max-content)); gap: 8px 28px; margin-top: 14px; }
    .identity-item { display: grid; grid-template-columns: 68px auto; gap: 8px; font-size: 14px; }
    .identity-label { color: var(--muted); }
    .identity-value { font-weight: 650; }
    .questions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; padding: 16px; }

    .q-number { flex: 0 0 auto; padding-top: 2px; color: var(--blue); font-size: 12px; font-weight: 800; }
    .q-title { font-size: 14px; line-height: 1.5; font-weight: 700; }
    .options { display: grid; gap: 6px; }
    .option { display: flex; align-items: flex-start; gap: 8px; min-height: 32px; padding: 7px 9px; border: 1px solid #ededed; border-radius: 7px; background: var(--empty); color: var(--secondary); font-size: 13px; line-height: 1.4; }

    .note { margin: 9px 0 0; padding: 9px 10px; border-left: 3px solid var(--blue); border-radius: 0 6px 6px 0; background: #f7faff; color: var(--secondary); font-size: 13px; line-height: 1.5; word-break: break-word; }

nk":""},{"label":"竞赛/奥数/思维","selected":false,"rank":""},{"label":"其他 请注明：","selected":false,"rank":""},{"label":"其他 请注明：_other","selected":false,"rank":""}],"notes":[]},{"id":"Q10","number":10,"title":"Q10 如果增加以下哪些小学学科，您会考虑观看视频讲解？","options":[{"label":"信息/编程","selected":false,"rank":""},{"label":"自然科学","selected":true,"rank":""},{"label":"奥数","selected":true,"rank":""},{"label":"其他 请注明：","selected":false,"rank":""},{"label":"其他 请注明：_other","selected":false,"rank":""},{"label":"完全不考虑观看视频讲解","selected":false,"rank":""}],"notes":[]},{"id":"Q11","number":11,"title":"Q11 对小学题目，您/孩子更希望视频怎么讲？","options":[{"label":"用更简单的语言讲","selected":true,"rank":""},{"label":"多用图形/动画演示","selected":true,"rank":""},{"label":"少讲公式，多讲理解","selected":true,"rank":""},{"label":"一步一步慢慢讲","selected":false,"rank":""},{"label":"讲完后配一道同类巩固题","selected":false,"rank":""},{"label":"家长能听懂，方便辅导","selected":false,"rank":""},{"label":"其他 请注明：","selected":false,"rank":""},{"label":"其他 请注明：_other","selected":false,"rank":""}],"notes":[]},{"id":"Q17","number":17,"title":"Q17 您对VIP视频相关内容还有什么其他建议？","options":[{"label":"增加互动性，答对题目有金币奖励，可以积分换IP礼品","selected":true,"rank":""}],"notes":[]}],"group":"非会员"}];
    const filters = document.getElementById('filters');
    const usersNode = document.getElementById('users');
    const count = document.getElementById('count');
    const search = document.getElementById('search');
    const searchButton = document.getElementById('searchButton');
    const clearButton = document.getElementById('clearButton');
    let activeGroup = '全部';

    function element(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function matchUser(user, group, uid) {
      if (group !== '全部' && user.group !== group) return false;
      return !uid || user.id === uid;
    }

    function makeOption(option) {
      const row = element('div', `option${option.selected ? ' selected' : ''}`);
      const check = element('span', 'check', option.selected ? '✓' : '');
      check.setAttribute('aria-hidden', 'true');
      row.append(check, element('span', 'option-text', option.label));
      if (option.rank) row.append(element('span', 'rank', `优先级 ${option.rank}`));
      return row;
    }

    function makeQuestion(answer) {
      const question = element('article', 'question');
      const head = element('div', 'question-head');
      head.append(element('span', 'q-number', answer.id), element('div', 'q-title', answer.title.replace(/^Q\d+\s*/, '')));
      question.append(head);
      if (answer.options.length) {
        const options = element('div', 'options');
        answer.options.forEach(option => options.append(makeOption(option)));
        question.append(options);
      } else {
        question.append(element('div', 'empty-answer', '未填写'));
      }
      answer.notes.forEach(note => question.append(element('p', 'note', `补充填写：${note}`)));
      return question;
    }

    function makeUser(user) {
      const card = element('article', 'user');
      const header = element('header', 'user-header');
      const title = element('div', 'user-title');
      title.append(element('span', 'group-badge', user.group));
      title.append(element('span', `user-name${user.name ? '' : ' empty'}`, user.name || '未填写姓名'));
      header.append(title, element('div', 'uid', `访谈记录 ID：${user.id}`));
      const identity = element('div', 'identity');
      [['访谈对象', user.identity.Q1], ['所在年级', user.identity.Q2], ['学习状态', user.identity.Q3]].forEach(([label, value]) => {
        const item = element('div', 'identity-item');
        item.append(element('span', 'identity-label', label), element('span', 'identity-value', value || '未填写'));
        identity.append(item);
      });
      header.append(identity);
      card.append(header);
      const questions = element('div', 'questions');
      user.answers.forEach(answer => questions.append(makeQuestion(answer)));
      card.append(questions);
      return card;
    }

    function renderFilters() {
      filters.replaceChildren();
      const groups = ['全部', ...new Set(DATA.map(user => user.group))];
      groups.forEach(group => {
        const button = element('button', 'filter', group);
        button.type = 'button';
        button.setAttribute('aria-pressed', String(group === activeGroup));
        button.addEventListener('click', () => { activeGroup = group; renderFilters(); render(); });
        filters.append(button);
      });
    }

    function render() {
      const uid = search.value.trim();
      const visible = DATA.filter(user => matchUser(user, activeGroup, uid));
      usersNode.replaceChildren();
      count.replaceChildren();
      const strong = element('strong', null, String(visible.length));
      count.append(strong, document.createTextNode(` / ${DATA.length} 位用户`));
      if (!visible.length) { usersNode.append(element('div', 'no-results', '没有找到匹配的用户或作答内容。')); return; }
      visible.forEach(user => usersNode.append(makeUser(user)));
    }

    searchButton.addEventListener('click', render);
    clearButton.addEventListener('click', () => { search.value = ''; search.focus(); render(); });
    search.addEventListener('keydown', event => { if (event.key === 'Enter') render(); });
    renderFilters();
    render();
  </script>
